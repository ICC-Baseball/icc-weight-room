<style>
:root{

  --navy:#0D233F; --navy2:#16345C; --red:#D10A0A; --red-soft:#FBE6E6;

}

    --bg:#08121F; --surface:#112038; --surface2:#182B47; --ink:#EEF2F8; --muted:#9FB0C8; --line:#24395A; --navy:#17375F; --navy2:#2A5288;
    --red:#F2443A; --red-soft:#3A1620; --good:#3FBF74; --good-soft:#123222; --bad:#F0566A; --gold:#E2B640; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#112038; --surface2:#182B47; --ink:#EEF2F8; --muted:#9FB0C8; --line:#24395A; --navy:#17375F; --navy2:#2A5288;
  --red:#F2443A; --red-soft:#3A1620; --good:#3FBF74; --good-soft:#123222; --bad:#F0566A; --gold:#E2B640; color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:inherit}
[hidden]{display:none!important}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.mark{width:40px;height:42px;object-fit:contain;flex:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.55))}
.brand{font:700 24px/1 var(--display);letter-spacing:.01em;text-decoration:none;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{display:block;font:500 13px/1.2 var(--body);opacity:.85;letter-spacing:0}
.brand .bs{display:none}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:grid;place-items:center}
.hbtns{display:flex;gap:8px;flex:none}
@media(max-width:460px){.brand .bl{display:none}.brand .bs{display:inline}.brand{font-size:22px}.brand small{display:none}.hbtns{gap:6px}.hbtns .iconbtn{width:38px;height:38px}}
.seam{height:7px;background:
  repeating-linear-gradient(115deg,transparent 0 6px,#E10700 6px 8px,transparent 8px 14px) top/100% 3.5px no-repeat,
  repeating-linear-gradient(65deg,transparent 0 6px,#E10700 6px 8px,transparent 8px 14px) bottom/100% 3.5px no-repeat,
  var(--navy)}
nav.tabs{max-width:980px;margin:0 auto;display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:7px 10px;border-radius:999px;text-decoration:none;font:600 15px/1 var(--display);letter-spacing:.02em;color:rgba(255,255,255,.85)}

main{max-width:980px;margin:0 auto;padding:16px 14px 80px}
.banner{background:var(--red-soft);border:1px solid var(--red);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05}
h1{font-size:34px;font-weight:800}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.section{margin-top:26px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-head a,.linkbtn{font-size:14px;font-weight:600;color:var(--red);text-decoration:none;border:0;background:none;padding:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

button.tile{width:100%;cursor:pointer}

.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:16px;padding:18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--red) 45%,transparent);pointer-events:none}

.navrow{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;margin-bottom:8px}

.search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:12px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font:600 13px/1 var(--body);color:var(--muted);text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:var(--surface2)}
.heat{display:flex;gap:2px;flex-wrap:nowrap}
.heat i{display:block;width:10px;height:16px;border-radius:2px;background:var(--line)}
.heat i.f{background:var(--good)}.heat i.p{background:var(--gold)}.heat i.m{background:var(--bad)}
.st{font-weight:700}.st.ok{color:var(--good)}.st.part{color:var(--gold)}.st.miss{color:var(--bad)}.st.none{color:var(--muted);font-weight:500}
.pct{display:inline-block;min-width:44px;font:800 18px/1 var(--display)}
.logday{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.logday table{margin-top:8px;font-size:14px}

.pname{font-weight:600}
.rk{font:700 18px/1 var(--display);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--red);font-weight:600;padding:4px 0;margin-bottom:8px}
.phead{display:flex;align-items:center;gap:4px}
.bigno{font:800 54px/1 var(--display);color:var(--red);margin-right:12px}

.statline div b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}

.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto}
.ptabs button{border:0;background:none;padding:10px 0;font:700 17px/1 var(--display);color:var(--muted);border-bottom:3px solid transparent;flex:none}
.ptabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.inp,input.inp,textarea.inp{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea.inp{width:100%;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--red);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.navy{background:var(--navy)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 5px}

/* Max cards */
.maxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.maxc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.maxc .mh{background:var(--navy);color:#fff;font:700 15px/1 var(--display);letter-spacing:.03em;padding:8px 12px}
.maxc .mb{padding:10px 12px}

.maxc .mv{font:800 34px/1 var(--display)}
.maxc .sub{margin-top:6px;font-size:12px}

/* Calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calhead .row{flex-wrap:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font:600 12px/1 var(--body);color:var(--muted);text-align:center;padding:6px 0}
.cday{min-height:74px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;color:inherit;min-width:0}
.cday.out{opacity:.45}
.cday .n{font:700 17px/1 var(--display)}
.cday.today .n{background:var(--red);color:#fff;border-radius:6px;padding:2px 5px;align-self:flex-start}
.cday[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.cday .ch{font:600 11px/1.15 var(--body);padding:2px 4px;border-radius:4px;background:var(--navy);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday .ch.c{background:var(--red)}
.cday .ok{font:700 11px/1 var(--body);color:var(--good);margin-top:auto}
.cday .ch .sm{display:none}
@media(max-width:560px){.cday{min-height:62px;padding:4px 3px}.cday .ch{font:700 10px/1.25 var(--body);padding:3px 3px;background:var(--red);text-align:center;border-radius:4px}.cday .ch.c{background:var(--navy)}.kind.calk{background:var(--red)}.kind.c.calk{background:var(--navy)}.cday .ch .lg{display:none}.cday .ch .sm{display:inline}.cday .ok{font-size:10px}}

/* Workout sheet */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--navy);color:#fff}
.wk-h.c{background:var(--red)}
.wk-h h3{color:#fff}
.wk-h .sub{color:rgba(255,255,255,.8)}
.wk-h .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.wk-notes{padding:10px 14px 0;font-size:14px;color:var(--muted);white-space:pre-wrap}
.ex{padding:12px 14px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ex-h b{font:700 20px/1.1 var(--display);display:block}
.done{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;font-size:14px}
.done .bx{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center}
.done small.dt{display:block;font-weight:500;font-size:11px;line-height:1.1;opacity:.9}
.done{flex-wrap:wrap;text-align:left}
.done[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.done[aria-pressed="true"] .bx{border-color:#fff;background:#fff;color:var(--good)}
.ex.isdone{background:var(--good-soft)}
table.sets{margin-top:8px;font-size:15px}
table.sets th,table.sets td{padding:7px 6px;text-align:center}
table.sets th:first-child,table.sets td:first-child{text-align:left}
table.sets td.snote{font-weight:600;color:var(--muted);font-size:13px}
.blk{display:inline-block;min-width:22px;text-align:center;font:700 13px/20px var(--display);background:var(--red);color:#fff;border-radius:5px;margin-right:8px;vertical-align:2px}
.gtag{display:inline-block;font:700 11px/18px var(--body);letter-spacing:.03em;text-transform:uppercase;padding:0 7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:2px}
.pday .blk{min-width:18px;line-height:17px;font-size:12px;margin-right:6px}
table.sets td.tg{font:800 22px/1 var(--display)}
table.sets td.tg.txt{font:700 15px/1.2 var(--body)}
table.sets td.tg.na{font:600 13px/1.2 var(--body);color:var(--red)}
table.sets input{width:84px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);text-align:center;font-weight:600}
.exnote{font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-wrap}
.cond-in{margin-top:8px;width:100%}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 2px}

/* Team status */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;width:110px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--good)}

/* Sheets */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(8,18,31,.55);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.sheet-bg{align-items:center}}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--navy);color:#fff;border-bottom:4px solid #E10700}
.sheet-h h2{color:#fff}
.sheet-h button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;width:36px;height:36px;font-size:20px;line-height:1}
.sheet-b{padding:16px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist button.pick{flex:1;text-align:left;border:0;background:none;padding:4px 0;font-weight:600}

.chart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header class="top">
  <div class="top-in">
    <img class="mark" src="" data-logo alt="Itawamba Indians logo">
    <a class="brand" href="#home"><span class="bl">Itawamba Weight Room</span><span class="bs">ICC Weight Room</span><small>Indian Baseball · strength &amp; conditioning</small></a>

/* ---------- storage: Supabase (table app_docs, app = 'weightroom') ---------- */
const APP = "weightroom";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
const store = {
  watchers: new Set(), channel: null, started: false, subscribedOnce: false,
  loadLocal() {},
  conds(where) { return !where ? [] : Array.isArray(where[0]) ? where : [where]; },
  match(v, conds) {
    return conds.every(([f, op, x]) => { const y = v ? v[f] : undefined;
      return op === "==" ? y === x : op === ">=" ? y >= x : op === "<=" ? y <= x : op === ">" ? y > x : op === "<" ? y < x : true; });
  },
  async fetch(w) {
    const out = {}, size = 1000;
    for (let from = 0; ; from += size) {
      let q = sb.from("app_docs").select("doc_id,data").eq("app", APP).eq("coll", w.coll);
      for (const [f, op, x] of w.conds) {
        const col = f === "player" ? "owner_key" : "data->>" + f;
        q = op === "==" ? q.eq(col, x) : op === ">=" ? q.gte(col, x) : op === "<=" ? q.lte(col, x) : op === ">" ? q.gt(col, x) : op === "<" ? q.lt(col, x) : q;
      }
      const {data, error} = await q.order("doc_id").range(from, from + size - 1);
      if (error) throw error;
      for (const r of data) out[r.doc_id] = r.data;
      if (data.length < size) break;
    }
    return out;
  },
  async refresh(w) {
    try { const docs = await this.fetch(w); if (!this.watchers.has(w)) return; w.docs = docs; w.cb({...docs}, false); }
    catch (e) { console.error(e); }
  },
  refreshAll() { this.watchers.forEach(w => this.refresh(w)); },
  watch(coll, where, cb) {
    const w = {coll, conds: this.conds(where), cb, docs: {}};
    this.watchers.add(w); this.refresh(w);
    return () => { this.watchers.delete(w); };
  },
  onChange(p) {
    const row = p.new && p.new.coll ? p.new : null, old = p.old || {};
    if ((row && row.app !== APP) || (!row && old.app && old.app !== APP)) return;
    for (const w of this.watchers) {
      if (p.eventType === "DELETE") {
        if (w.coll === old.coll && old.doc_id in w.docs) { delete w.docs[old.doc_id]; w.cb({...w.docs}, false); }
      } else if (row && w.coll === row.coll) {
        if (this.match(row.data, w.conds)) w.docs[row.doc_id] = row.data;
        else if (row.doc_id in w.docs) delete w.docs[row.doc_id];
        else continue;
        w.cb({...w.docs}, false);
      }
    }
  },
  start() {
    if (this.started) return; this.started = true;
    this.channel = sb.channel("weightroom-docs")
      .on("postgres_changes", {event: "*", schema: "public", table: "app_docs"}, p => this.onChange(p))
      .subscribe(status => {
        if (status === "SUBSCRIBED") { if (this.subscribedOnce) this.refreshAll(); this.subscribedOnce = true; }
      });
    /* phones sleep and drop the live connection: catch up whenever the app comes back */
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") this.refreshAll(); });
    window.addEventListener("online", () => this.refreshAll());
  },
  async set(path, data) {
    const i = path.indexOf("/"), coll = path.slice(0, i), doc_id = path.slice(i + 1);
    const {error} = await sb.from("app_docs").upsert({app: APP, coll, doc_id, data}, {onConflict: "app,coll,doc_id"});
    if (error) throw error;
  },
  async del(path) {
    const i = path.indexOf("/"), coll = path.slice(0, i), doc_id = path.slice(i + 1);
    const {error} = await sb.from("app_docs").delete().eq("app", APP).eq("coll", coll).eq("doc_id", doc_id);
    if (error) throw error;
  }
};
/* one write at a time per document, latest wins */
const pending = {}, inflight = {};
function write(path, data) { pending[path] = JSON.parse(JSON.stringify(data)); if (!inflight[path]) flush(path); }
async function flush(path) {
  inflight[path] = true;
  while (pending[path]) {
    const d = pending[path]; delete pending[path];
    try { await store.set(path, d); }
    catch (e) {
      console.error(e);
      if (e && (e.code === "42501" || /row-level security/i.test(e.message || ""))) toast("You don't have permission to save this.");
      else toast("Couldn't save. Check your connection and try again.");
    }

}

/* ---------- scheme parsing (shared by Excel import & editor) ---------- */
function normPct(v) {
  if (v === "" || v == null) return null;
  if (typeof v === "number") return v <= 1.5 ? v : v / 100;
  const s = String(v), m = s.match(/\d+(\.\d+)?/); if (!m) return null;
  const n = parseFloat(m[0]); return /%/.test(s) ? n / 100 : (n <= 1.5 ? n : n / 100);
}
function parseOne(str) {
  let s = String(str).trim(); if (!s) return null;
  let pct = null, load = null;
  const pm = s.match(/(\d+(?:\.\d+)?)\s*%/); if (pm) { pct = parseFloat(pm[1]) / 100; s = s.replace(pm[0], " "); }
  const lm = s.match(/(\d+(?:\.\d+)?)\s*(lbs?|#)/i); if (lm) { load = parseFloat(lm[1]); s = s.replace(lm[0], " "); }
  s = s.replace(/@/g, " ");
  const sx = s.match(/(\d+)\s*[x×X*]\s*(\d+\+?(?:\s*-\s*\d+)?|max|amrap)/i);
  if (sx) return Array.from({length: Math.min(+sx[1], 20)}, () => ({reps: sx[2].replace(/\s/g, ""), pct, load}));
  const r = s.match(/\d+\+?(?:\s*-\s*\d+)?|amrap|max/i);
  if (r || pct != null || load != null) return [{reps: r ? r[0].replace(/\s/g, "") : "", pct, load}];
  return null;
}
function parseScheme(str) {
  const parts = String(str ?? "").split(/\s*[,;]\s*/).filter(Boolean);
  const out = []; for (const p of parts) { const r = parseOne(p); if (r) out.push(...r); }
  return out;
}
function schemeText(sets) {
  const out = []; let i = 0;
  while (i < sets.length) {
    let j = i; const a = sets[i];
    while (j + 1 < sets.length && sets[j + 1].reps == a.reps && sets[j + 1].pct == a.pct && sets[j + 1].load == a.load) j++;
    const n = j - i + 1;
    let t = (n > 1 ? `${n}x` : "") + (a.reps || "");
    if (a.pct != null) t += ` @ ${+(a.pct * 100).toFixed(1)}%`;
    else if (a.load != null) t += ` @ ${a.load}lb`;
    out.push(t.trim()); i = j + 1;
  }
  return out.join(", ");
}
function guessBasis(name) {
  const n = String(name).toLowerCase();
  if (isDbBench(n)) return "dbbench";
  if (/bench/.test(n) && !/jump|step|dip/.test(n)) return "bench";
  if (/dead\s*-?lift|\bdl\b|rdl/.test(n)) return "deadlift";
  if (/squat/.test(n) && !/split|goblet|bulgarian|jump|wall|pistol|cossack|lunge|sissy/.test(n)) return "squat";
  return "";
}

  if (d === t) return `<span class="st ok">✓ Done</span>`;
  if (d) return `<span class="st part">${d}/${t}</span>`;
  return past ? `<span class="st miss">✗ Missed</span>` : `<span class="st none">Not yet</span>`;
}
function vCoach() {
  if (!isCoach()) return `<p class="empty">The coaches dashboard is for the coaching staff.</p>`;

  const tasks = taskList(cd);
  let daily;
  if (!tasks.length) daily = `<div class="panel empty">Nothing scheduled on this day.</div>`;
  else {
    const rows = ROSTER.map(p => ({p, s: dayStat(cd, p.key)}));
    const hasL = rows.some(r => r.s.lt), hasC = rows.some(r => r.s.ct);
    const fin = rows.filter(r => r.s.total && r.s.done === r.s.total).length, started = rows.filter(r => r.s.done && r.s.done < r.s.total).length, none = rows.filter(r => r.s.total && !r.s.done).length;
    const f = S.cfilter || "all";
    const shown = rows.filter(r => f === "all" || (f === "open" ? r.s.done < r.s.total : r.s.done === r.s.total)).sort((a, b) => (a.s.done / (a.s.total || 1)) - (b.s.done / (b.s.total || 1)) || a.p.no - b.p.no);

      <div class="tile"><div class="lbl">Partly done</div><div class="val">${started}</div></div>
      <div class="tile"><div class="lbl">${past ? "Missed" : "Not started"}</div><div class="val" style="color:${none ? "var(--bad)" : "inherit"}">${none}</div></div>
      <div class="tile"><div class="lbl">Scheduled</div><div class="val" style="font-size:20px;line-height:1.3">${esc(dayWorkouts(cd).map(w => w.kind === "cond" ? "Conditioning" : shortTitle(w)).join(" + "))}</div></div></div>
      <div class="seg" style="margin-top:12px">${[["all", "Everyone"], ["open", "Not finished"], ["done", "Finished"]].map(([v, l]) => `<button data-cfilter="${v}" aria-pressed="${f === v}">${l}</button>`).join("")}</div>
      <div class="tablewrap"><table><thead><tr><th>Player</th><th></th>${hasL ? "<th>Lift</th>" : ""}${hasC ? "<th>Conditioning</th>" : ""}<th>Tasks</th><th>Checked off</th></tr></thead><tbody>
      ${shown.map(({p, s}) => `<tr class="go" data-go-day="${cd}" data-as="${p.key}"><td><span class="jn">${p.no}</span><span class="pname">${esc(pretty(p.name))}</span></td><td></td>${hasL ? `<td>${stCell(s.ld, s.lt, past)}</td>` : ""}${hasC ? `<td>${stCell(s.cd, s.ct, past)}</td>` : ""}<td>${s.done}/${s.total}<span class="bar"><i style="width:${s.total ? s.done / s.total * 100 : 0}%"></i></span></td><td>${timeCell(s, cd)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Nobody here.</td></tr>`}
      </tbody></table></div><p class="sub" style="margin-top:6px">Tap a player to open his workout for this day and see the weights he logged.</p>`;
  }
  /* monthly */
  const [y, m] = cm.split("-").map(Number);
  const mTitle = new Date(y, m - 1, 1).toLocaleDateString("en-US", {month: "long", year: "numeric"});
  const ds = Object.keys(S.days).filter(d => d.startsWith(cm) && d <= today && dayWorkouts(d).length).sort();
  let monthly;
  if (!ds.length) monthly = `<div class="panel empty">${cm > today.slice(0, 7) ? "This month hasn't started yet." : "No scheduled workouts have happened yet this month."} Numbers fill in after each workout day.</div>`;
  else {
    const stats = ROSTER.map(p => {
      let sched = 0, full = 0, part = 0, miss = 0, ls = 0, lf = 0, cs = 0, cf = 0, td = 0, tt = 0; const heat = [];
      for (const d of ds) {
        const s = dayStat(d, p.key); if (!s.total) continue;

        const st = s.done === s.total ? "f" : s.done ? "p" : "m"; heat.push([d, st]);

  }

function playerLogHtml(k) {

    const rows = dayWorkouts(d).flatMap(w => (w.items || []).map(it0 => {

      const tgTxt = tg.length ? [...new Set(tg)].join("/") : "";
      return `<tr><td>${mark}</td><td>${it.block ? `<span class="blk">${esc(it.block)}</span>` : ""}${esc(it.name)}<div class="sub">${esc(schemeText(it.sets || []))}${tgTxt ? " · target " + esc(tgTxt) : ""}</div></td><td class="r">${act.length ? `<b>${esc(act.join(", "))}</b>` : `<span class="sub">no weights</span>`}</td></tr>`;

function weightChart(wi) {
  const W = 600, H = 180, P = 28;
  const xs = wi.map(w => fromIso(w.d).getTime()), ys = wi.map(w => +w.w);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) - 2, y1 = Math.max(...ys) + 2;
  const X = t => P + (x1 === x0 ? 0.5 : (t - x0) / (x1 - x0)) * (W - 2 * P), Y = v => H - P - (v - y0) / (y1 - y0) * (H - 2 * P);
  const pts = wi.map((w, i) => `${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--line)"/>
    <text x="${P}" y="${Y(y1) + 4}" font-size="12" fill="var(--muted)">${Math.round(y1)}</text><text x="${P}" y="${H - P - 4}" font-size="12" fill="var(--muted)">${Math.round(y0)}</text>
    <polyline points="${pts}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round"/>
    ${wi.map((w, i) => `<circle cx="${X(xs[i])}" cy="${Y(ys[i])}" r="4" fill="var(--navy)"/>`).join("")}
    <text x="${P}" y="${H - 8}" font-size="12" fill="var(--muted)">${esc(fmtDate(wi[0].d, {month: "short", day: "numeric"}))}</text>
    <text x="${W - P}" y="${H - 8}" font-size="12" fill="var(--muted)" text-anchor="end">${esc(fmtDate(wi[wi.length - 1].d, {month: "short", day: "numeric"}))}</text></svg>`;
}

/* ---------- upload handling ---------- */
const cleanName = fn => fn.replace(/\.[^.]+$/, "").replace(/_{2}\d+_?$/, "").replace(/_+/g, " ").replace(/\s{2,}\d+\s*$/, "").replace(/\s*\(\d+\)\s*$/, "").replace(/^ICC\s+/i, "").replace(/\s+/g, " ").trim();
async function handleFiles(files) {
  if (typeof XLSX === "undefined") { toast("The spreadsheet reader didn't load. Check your connection and reload the page."); return; }
  const all = [], names = [], unmatched = new Set(), groups = new Set(); let players = 0;
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), {type: "array"});
      const nm = cleanName(f.name); names.push(nm);
      const r = parseWorkbook(wb, nm);
      r.days.forEach(d => d.src = nm);
      all.push(...r.days); players = Math.max(players, r.players || 0); (r.unmatched || []).forEach(x => unmatched.add(x)); (r.groups || []).forEach(x => groups.add(x));
    } catch (e) { console.error(e); toast(`Couldn't read ${f.name}. Save it as .xlsx and try again.`); }
  }
  if (!all.length) { toast("No exercises found in that file."); return; }
  const prev = S.upload;
  if (prev) {
    // adding more files keeps what's already in the preview; a re-picked file replaces its old copy
    const srcs = new Set(all.map(d => d.src));
    const keep = prev.days.map((d, i) => [d, prev.on[i]]).filter(([d]) => !srcs.has(d.src));
    prev.days = [...keep.map(x => x[0]), ...all]; prev.on = [...keep.map(x => x[1]), ...all.map(() => true)];
    prev.groups = [...new Set([...(prev.groups || []), ...groups])];
    prev.players = Math.max(prev.players || 0, players); prev.unmatched = [...new Set([...(prev.unmatched || []), ...unmatched])];
    prev.name = [...new Set(prev.days.map(d => d.src))].join(" + ");
  } else {
    const start = S.date >= todayIso() ? S.date : todayIso();
    S.upload = {name: names.join(" + "), days: all, start, skip: true, on: all.map(() => true), players, unmatched: [...unmatched], groups: [...groups]};
  }
  const u = S.upload;
  const order = d => [d.week ?? 0, d.src];
  const pairs = u.days.map((d, i) => [d, u.on[i]]).sort((a, b) => (a[0].week ?? 0) - (b[0].week ?? 0) || String(a[0].src).localeCompare(String(b[0].src)));
  u.days = pairs.map(p => p[0]); u.on = pairs.map(p => p[1]);
  recomputeDates(u);
  toast(`${all.length} workout${all.length === 1 ? "" : "s"} added. ${new Set(u.days.map(d => d.src)).size} file${new Set(u.days.map(d => d.src)).size === 1 ? "" : "s"} ready to post.`);
  render();
}
function postUpload(force) {
  const u = S.upload; if (!u) return;
  const missing = u.days.some((d, i) => u.on[i] && d.items.some(it => it.sets.some(s => s.pct != null) && !it.basis));
  if (missing && !force) { askConfirm("Some percentage exercises don't have a max picked, so players won't see target weights for them. Post anyway?", "Post anyway", () => postUpload(true)); return; }
  const byDate = {};
  const pid = uid();
  u.days.forEach((d, i) => { if (!u.on[i]) return; (byDate[u.dates[i]] = byDate[u.dates[i]] || []).push({id: uid(), kind: "lift", title: d.title || d.label, notes: "", prog: pid, items: d.items.map(it => ({...it, id: uid()}))}); });
  for (const [date, ws] of Object.entries(byDate)) { S.days[date] = {date, workouts: [...dayWorkouts(date), ...ws]}; write("days/" + date, S.days[date]); }
  S.programs[pid] = {name: u.name, uploadedAt: new Date().toISOString(), days: u.days};
  write("programs/" + pid, S.programs[pid]);
  const n = Object.keys(byDate).length, first = Object.keys(byDate).sort()[0];
  S.upload = null; toast(`Posted to ${n} day${n === 1 ? "" : "s"}`);
  if (first) { S.date = first; S.month = first.slice(0, 7); }
  location.hash = "calendar"; render();
}
function repostProgram(id) {
  const p = S.programs[id];
  const days = JSON.parse(JSON.stringify(p.days)); days.forEach(d => d.src = d.src || p.name);
  S.upload = {name: p.name, days, start: todayIso(), skip: true, on: days.map(() => true)};
  recomputeDates(S.upload);
  render(); window.scrollTo(0, 0);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,tr,a"); if (!t || !$("#app").contains(t) && !t.closest("#app")) return;
  const d = t.dataset;
  if (d.goDay) { S.date = d.goDay; S.month = d.goDay.slice(0, 7); S.teamView = d.team === "1"; if (d.as) S.viewAs = d.as; else if (!isCoach()) S.viewAs = null; subDayLogs(); if (location.hash !== "#day") location.hash = "day"; else render(); return; }
  if (d.player) { S.player = d.player; S.ptab = d.ptabgo || "maxes"; location.hash = "player"; return; }
  if (d.cshift) { const n = +d.cshift; S.date = n ? addDays(S.date, n) : todayIso(); subDayLogs(); render(); return; }
  if (d.cmonth) { const n = +d.cmonth; if (!n) S.cmonth = todayIso().slice(0, 7); else { const [y, m] = (S.cmonth || todayIso().slice(0, 7)).split("-").map(Number); S.cmonth = iso(new Date(y, m - 1 + n, 1)).slice(0, 7); } render(); return; }
  if (d.cfilter) { S.cfilter = d.cfilter; render(); return; }
  if (d.csort) { S.csort = d.csort; render(); return; }
  if (d.viewas) { S.viewAs = d.viewas; S.teamView = false; render(); return; }
  if (d.month) { const n = +d.month; if (!n) S.month = todayIso().slice(0, 7); else { const [y, m] = S.month.split("-").map(Number); const x = new Date(y, m - 1 + n, 1); S.month = iso(x).slice(0, 7); } render(); return; }
  if (d.shift) { S.date = addDays(S.date, +d.shift); S.month = S.date.slice(0, 7); subDayLogs(); render(); return; }
  if (d.team) { S.teamView = d.team === "1"; render(); return; }
  if (d.add) { if (d.add === "program") addFromProgram(S.date); else editWorkout(S.date, null, d.add); return; }
  if (d.editw) { editWorkout(S.date, d.editw); return; }
  if (d.done) {
    const who = S.viewAs || S.me; if (!who || !canEditPlayer(who)) return;
    if (lockReason(S.date)) { toast(lockReason(S.date)); return; }
    saveLog(S.date, who, lg => { const it = lg.items[d.done] = lg.items[d.done] || {}; it.done = !it.done; it.at = new Date().toISOString(); if (isCoach() && who !== S.me) it.by = "coach"; else delete it.by; });
    render(); return;
  }
  if (d.fill) {
    const who = S.viewAs || S.me; const [wid, iid] = d.fill.split(":"); const it0 = dayWorkouts(S.date).find(w => w.id === wid)?.items.find(x => x.id === iid); if (!it0) return;
    const it = resolveItem(it0, who);
    saveLog(S.date, who, lg => { const li = lg.items[d.fill] = lg.items[d.fill] || {}; li.w = li.w || []; it.sets.forEach((s, i) => { const tg = tgtFor(who, it, s, i); if ((li.w[i] ?? "") === "" && typeof tg === "number") li.w[i] = tg; }); for (let i = 0; i < li.w.length; i++) if (li.w[i] == null) li.w[i] = ""; });
    render(); return;
  }
  if (d.addmax) { S.player = S.viewAs || S.me; S.ptab = "maxes"; location.hash = "player"; setTimeout(() => $(`[data-max="${d.addmax}"]`)?.focus(), 60); return; }
  if (d.ptab) { S.ptab = d.ptab; render(); return; }
  if (d.lb) { S.lb = d.lb; render(); return; }
  if ("back" in d) { history.length > 1 ? history.back() : (location.hash = "roster"); return; }
  if (d.delwi) {
    const k = S.player; const a = {...(S.athletes[k] || {})}; a.weighIns = (a.weighIns || []).filter(w => w.d !== d.delwi); S.athletes[k] = a; write("athletes/" + k, a); render(); return;
  }
  if (d.reprog) { repostProgram(d.reprog); return; }
  if (d.unpost) {
    const p = S.programs[d.unpost]; if (!p) return;
    const sigs = new Set((p.days || []).map(x => x.items.map(i => i.name).join("|")));
    const hit = w => w.prog === d.unpost || (!w.prog && w.kind === "lift" && sigs.has((w.items || []).map(i => i.name).join("|")));
    const dates = Object.keys(S.days).filter(dt => dayWorkouts(dt).some(hit));
    if (!dates.length) { toast("Nothing from this program is on the calendar."); return; }
    askConfirm(`Remove this program's lifts from ${dates.length} day${dates.length === 1 ? "" : "s"}? Conditioning and other lifts stay.`, "Remove from calendar", () => {
      dates.forEach(dt => saveDay(dt, dayWorkouts(dt).filter(w => !hit(w))));
      toast(`Removed from ${dates.length} day${dates.length === 1 ? "" : "s"}`);
    }); return;
  }
  if (d.delprog) { const id = d.delprog; askConfirm("Delete this saved program? Days already on the calendar stay.", "Delete program", () => { delete S.programs[id]; store.del("programs/" + id).catch(() => toast("Couldn't delete.")); render(); }); return; }
  if (t.id === "rAdd") { if (isCoach()) addPlayerModal(); return; }
  if (t.id === "rEdit") { S.redit = !S.redit; render(); return; }
  if (d.rmplayer) { if (isCoach()) removePlayer(d.rmplayer); return; }
  if (t.id === "wiAdd") {
    const k = S.player, dd = $("#wiDate").value, v = parseFloat($("#wiVal").value);
    if (!dd || !(v > 50 && v < 500)) { toast("Enter a body weight in pounds."); return; }
    const a = {...(S.athletes[k] || {})}; a.weighIns = [...(a.weighIns || []).filter(w => w.d !== dd), {d: dd, w: v}].sort((x, y) => x.d < y.d ? -1 : 1).slice(-400);
    S.athletes[k] = a; write("athletes/" + k, a); toast("Weigh-in logged"); render(); return;
  }
  if (t.id === "upClear") { S.upload = null; render(); return; }
  if (t.id === "upPost") { postUpload(); return; }
});
document.addEventListener("change", e => {
  const el = e.target; if (!$("#app").contains(el)) return; const d = el.dataset;
  if (d.act) {
    const who = S.viewAs || S.me; if (!who || !canEditPlayer(who)) return;
    if (lockReason(S.date)) { toast(lockReason(S.date)); needRender = true; return; }
    const v = el.value === "" ? "" : Number(el.value);
    saveLog(S.date, who, lg => { const li = lg.items[d.act] = lg.items[d.act] || {}; li.w = li.w || []; li.w[+d.i] = v; for (let i = 0; i < li.w.length; i++) if (li.w[i] == null) li.w[i] = ""; li.wAt = new Date().toISOString(); });
    return;
  }
  if (d.result) { const who = S.viewAs || S.me; if (!who || !canEditPlayer(who)) return; if (lockReason(S.date)) { toast(lockReason(S.date)); needRender = true; return; } saveLog(S.date, who, lg => { const li = lg.items[d.result] = lg.items[d.result] || {}; li.note = el.value.trim(); }); return; }
  if (d.max) {
    if (!isCoach()) { toast("Only coaches can change maxes."); render(); return; }
    const k = S.player, v = el.value === "" ? null : Math.round(Number(el.value));
    if (v != null && !(v > 0 && v < 1500)) { toast("Enter a max in pounds."); return; }
    const a = JSON.parse(JSON.stringify(S.maxDocs[k] || {})); a.maxes = a.maxes || {}; a.maxDates = a.maxDates || {};
    if (a.maxes[d.max] === v) return;
    a.maxes[d.max] = v; a.maxDates[d.max] = todayIso();
    if (v) a.maxHistory = [...(a.maxHistory || []), {lift: d.max, v, d: todayIso()}].slice(-200);
    S.maxDocs[k] = a; write("maxes/" + k, a); toast(`${MAX_NAME[d.max]} max saved`); needRender = true; return;
  }
  if (el.id === "liftGrp") {
    if (!isCoach()) return;
    const k = S.player, p = player(k); if (!p) return;
    const a = JSON.parse(JSON.stringify(S.maxDocs[k] || {}));
    if (el.value === posGroup(p.pos)) delete a.liftGroup; else a.liftGroup = el.value;
    S.maxDocs[k] = a; write("maxes/" + k, a); toast(`${pretty(p.name)} now lifts with the ${GROUP_NAME[el.value].toLowerCase()}`); render(); return;
  }
  if (el.id === "viewAs") { S.viewAs = el.value || null; needRender = false; render(); return; }
  const u = S.upload;
  if (u) {
    if (el.id === "upStart" || el.id === "upSkip" || d.updow != null) {
      u.start = $("#upStart").value || todayIso(); u.skip = $("#upSkip") ? $("#upSkip").checked : u.skip;
      if (d.updow != null) { u.dow[d.updow] = +el.value; const m = savedDow(); m[d.updow] = +el.value; try { localStorage.setItem("icc-wr-dow", JSON.stringify(m)); } catch (e) {} }
      recomputeDates(u); needRender = false; render(); return;
    }
    if (d.update) { u.dates[+d.update] = el.value; return; }
    if (d.upon) { u.on[+d.upon] = el.checked; needRender = false; render(); return; }
    if (d.uptitle) { u.days[+d.uptitle].title = el.value.trim() || u.days[+d.uptitle].title; return; }
    if (d.upbasis) { const [di, ii] = d.upbasis.split(":").map(Number); u.days[di].items[ii].basis = el.value; needRender = false; render(); return; }
  }
  if (el.id === "xl" && el.files.length) { handleFiles([...el.files]); el.value = ""; }
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
document.addEventListener("dragover", e => { const dz = e.target.closest?.("#dz"); if (dz) { e.preventDefault(); dz.classList.add("over"); } });
document.addEventListener("dragleave", e => { const dz = e.target.closest?.("#dz"); if (dz) dz.classList.remove("over"); });
document.addEventListener("drop", e => { const dz = e.target.closest?.("#dz"); if (dz) { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]); } });
$("#setBtn").onclick = openSettings;
$("#meBtn").onclick = () => { if (S.me) { S.player = S.me; S.ptab = "maxes"; location.hash = "player"; render(); } else openSettings(); };

function route() {
  const h = location.hash.slice(1);
  if (h === "player" && S.view !== "player") S.prevView = S.view;
  S.view = ["home", "calendar", "day", "roster", "player", "leaders", "upload", "coach"].includes(h) ? h : "home";
  if (S.view === "player" && !S.player) S.view = S.me ? (S.player = S.me, "player") : "roster";
  render(); if (h) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

/* ---------- sign-in ---------- */
function authCard(inner) {
  return `<div style="max-width:420px;margin:24px auto 0"><div class="hero"><img src="${LOGO}" alt="" style="width:64px;height:68px;object-fit:contain"><h1 style="margin-top:8px">ICC Weight Room</h1>${inner}</div></div>`;
}
function renderAuth() {
  $("#tabs").innerHTML = ""; $(".hbtns").hidden = true;
  const v = S.authView || "in", msg = S.authMsg ? `<div class="banner" style="margin-top:12px">${esc(S.authMsg)}</div>` : "";
  const email = `<label class="f" for="aEmail">Email</label><input class="inp" style="width:100%" id="aEmail" type="email" autocomplete="email" inputmode="email" value="${esc(S.authEmail || "")}" required>`;
  const pw = (id, lbl, ac) => `<label class="f" for="${id}">${lbl}</label><input class="inp" style="width:100%" id="${id}" type="password" autocomplete="${ac}" minlength="6" required>`;
  let body;
  if (v === "in") body = `<p class="sub">Sign in with the email your coach put on the roster.</p><form id="aForm">${email}${pw("aPass", "Password", "current-password")}
      <div class="row" style="margin-top:16px"><button class="btn" type="submit">Sign in</button></div></form>
      <div class="row" style="margin-top:14px;gap:16px"><button class="linkbtn" data-auth="up">First time? Create your account</button><button class="linkbtn" data-auth="forgot">Forgot password</button></div>`;
  else if (v === "up") body = `<p class="sub">Use the same email your coach has on the roster. That's how the app knows who you are.</p><form id="aForm">${email}${pw("aPass", "Make a password (6+ characters)", "new-password")}
      <div class="row" style="margin-top:16px"><button class="btn" type="submit">Create account</button></div></form>
      <div class="row" style="margin-top:14px"><button class="linkbtn" data-auth="in">Already have an account? Sign in</button></div>`;
  else if (v === "forgot") body = `<p class="sub">We'll email you a link to set a new password.</p><form id="aForm">${email}
      <div class="row" style="margin-top:16px"><button class="btn" type="submit">Send link</button></div></form>
      <div class="row" style="margin-top:14px"><button class="linkbtn" data-auth="in">Back to sign in</button></div>`;
  else body = `<p class="sub">Choose a new password.</p><form id="aForm">${pw("aPass", "New password (6+ characters)", "new-password")}
      <div class="row" style="margin-top:16px"><button class="btn" type="submit">Save password</button></div></form>`;
  $("#app").innerHTML = authCard(body + msg);
  $$("[data-auth]").forEach(b => b.onclick = () => { S.authEmail = ($("#aEmail") || {}).value || S.authEmail; S.authView = b.dataset.auth; S.authMsg = ""; renderAuth(); });
  $("#aForm").onsubmit = async e => {
    e.preventDefault();
    const btn = $("#aForm button[type=submit]"); btn.disabled = true;
    const em = ($("#aEmail") || {}).value?.trim(), pass = ($("#aPass") || {}).value;
    S.authEmail = em || S.authEmail; S.authMsg = "";
    try {
      if (v === "in") { const {error} = await sb.auth.signInWithPassword({email: em, password: pass}); if (error) throw error; return; }
      if (v === "up") {
        const {data, error} = await sb.auth.signUp({email: em, password: pass, options: {emailRedirectTo: location.origin + location.pathname}});
        if (error) throw error;
        if (!data.session) { S.authView = "in"; S.authMsg = "Check your email and tap the link to finish creating your account. Then sign in here."; }
        else return;
      } else if (v === "forgot") {
        const {error} = await sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin + location.pathname});
        if (error) throw error;
        S.authView = "in"; S.authMsg = "If that email has an account, a reset link is on its way.";
      } else {
        const {error} = await sb.auth.updateUser({password: pass}); if (error) throw error;
        S.authView = "in"; S.authMsg = ""; toast("Password saved");
        const {data: {session}} = await sb.auth.getSession(); if (session) { startSession(session); return; }
      }
    } catch (err) {
      const m = String(err && err.message || err);
      S.authMsg = /invalid login/i.test(m) ? "That email and password don't match. Try again or reset your password."
        : /not confirmed/i.test(m) ? "Your email isn't confirmed yet. Tap the link in the email we sent you."
        : /already registered/i.test(m) ? "That email already has an account. Sign in instead." : m;
    }
    renderAuth();
  };
}
function vNoAccess() {
  return authCard(`<p>You're signed in as <b>${esc(S.user && S.user.email)}</b>, but that email isn't on the team roster yet.</p>
    <p class="sub">Ask a coach to add this email to your name in the app (Settings › Player logins). Then tap Try again.</p>
    <div class="row" style="margin-top:14px"><button class="btn" id="naRetry">Try again</button><button class="btn ghost" id="naOut">Sign out</button></div>`);
}
async function signOut() { try { await sb.auth.signOut(); } catch (e) {} location.hash = ""; location.reload(); }

/* ---------- player logins (coaches) ---------- */
const ROLE_NAME = {hitter: "Hitter", pitcher: "Pitcher", two_way: "Two-way"};
function roleOf(pos) {
  const parts = String(pos || "").split("/").map(s => s.trim()).filter(Boolean);
  const isP = s => /^(r|l)?hp$|^p$/i.test(s);
  const p = parts.some(isP), h = parts.some(s => !isP(s));
  return p && h ? "two_way" : p ? "pitcher" : "hitter";
}
async function syncPlayers(prev, next) {
  if (!isCoach()) return;
  try {
    const ops = [];
    const setActive = (k, on) => ops.push(sb.from("players").update({active: on}).eq("app_key", k));
    next.removed.filter(k => !prev.removed.includes(k)).forEach(k => setActive(k, false));
    prev.removed.filter(k => !next.removed.includes(k)).forEach(k => setActive(k, true));
    const pa = prev.added.map(p => p.key), na = next.added.map(p => p.key);
    next.added.filter(p => !pa.includes(p.key)).forEach(p => {
      const [l, f] = String(p.name).split(", ");
      ops.push(sb.from("players").upsert({app_key: p.key, first_name: f || p.name, last_name: l || "", jersey: String(p.no), position: roleOf(p.pos), class_year: p.cl || null, active: true}, {onConflict: "app_key"}));
    });
    prev.added.filter(p => !na.includes(p.key)).forEach(p => setActive(p.key, false));
    const res = await Promise.all(ops);
    const bad = res.find(r => r.error); if (bad) throw bad.error;
  } catch (e) { console.error(e); toast("Roster saved, but player logins didn't update. Check Settings › Player logins."); }
}
async function openLogins() {
  openModal("Player logins", `<p class="sub">Loading…</p>`);
  const [pl, co] = await Promise.all([
    sb.from("players").select("id,app_key,first_name,last_name,jersey,position,email,user_id,active").order("last_name"),
    sb.from("coaches").select("id,name,email,user_id").order("name")]);
  if (pl.error || co.error) { $(".sheet-b").innerHTML = `<p class="warn">Couldn't load logins. ${esc((pl.error || co.error).message)}</p>`; return; }
  const players = pl.data.filter(p => p.active).sort((a, b) => (+a.jersey || 0) - (+b.jersey || 0));
  const status = r => r.user_id ? `<span class="st ok">Signed up</span>` : r.email ? `<span class="st part">Waiting on signup</span>` : `<span class="st none">No email</span>`;
  $(".sheet-b").innerHTML = `<p class="sub">Put each player's email next to his name, then tell him to open the app and tap <b>Create your account</b> with that email. He'll be linked to his name automatically.</p>
    <input class="search" id="lq" type="search" placeholder="Search players">
    <ul class="plist" id="ll">${players.map(p => `<li data-n="${esc((p.first_name + " " + p.last_name).toLowerCase())}" style="flex-wrap:wrap"><span class="jn">${esc(p.jersey || "")}</span><span style="flex:1 1 140px"><b>${esc(p.first_name)} ${esc(p.last_name)}</b> <span class="sub">${ROLE_NAME[p.position] || ""}</span><br>${status(p)}</span>
      <input class="inp" type="email" inputmode="email" autocomplete="off" placeholder="player@email.com" data-pemail="${p.id}" value="${esc(p.email || "")}" style="flex:2 1 200px"></li>`).join("")}</ul>
    <h3 style="margin-top:22px">Coaches</h3><p class="sub">Coaches can post lifts, change maxes and see every player.</p>
    <ul class="plist">${co.data.map(c => `<li><span style="flex:1"><b>${esc(c.name)}</b> <span class="sub">${esc(c.email)}</span><br>${status(c)}</span></li>`).join("")}</ul>
    <div class="row" style="margin-top:10px"><input class="inp" id="cName" placeholder="Coach name" style="flex:1 1 140px"><input class="inp" id="cEmail" type="email" placeholder="coach@email.com" style="flex:2 1 180px"><button class="btn sm" id="cAdd">Add coach</button></div>`;
  const sh = $(".sheet");
  $("#lq", sh).oninput = e => { const q = e.target.value.toLowerCase(); $$("#ll li", sh).forEach(li => li.hidden = !li.dataset.n.includes(q)); };
  $$("[data-pemail]", sh).forEach(inp => inp.onchange = async () => {
    const v = inp.value.trim().toLowerCase() || null;
    if (v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast("That doesn't look like an email."); return; }
    const {error} = await sb.from("players").update({email: v}).eq("id", inp.dataset.pemail);
    if (error) toast(error.code === "23505" ? "That email is already on another player." : "Couldn't save. " + error.message);
    else toast(v ? "Email saved" : "Email removed");
  });
  $("#cAdd", sh).onclick = async () => {
    const n = $("#cName", sh).value.trim(), em = $("#cEmail", sh).value.trim().toLowerCase();
    if (!n || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { toast("Enter a name and email."); return; }
    const {error} = await sb.from("coaches").insert({name: n, email: em});
    if (error) { toast(error.code === "23505" ? "That coach is already added." : "Couldn't add. " + error.message); return; }
    toast(`${n} added as a coach`); openLogins();
  };
}

/* ---------- boot ---------- */
let sessionStarted = false;
async function startSession(session) {
  if (sessionStarted) return; sessionStarted = true;
  S.user = session.user; S.authView = null; S.authMsg = "";
  const [k, c] = await Promise.all([sb.rpc("my_player_key"), sb.rpc("is_coach")]);
  if (k.error || c.error) console.error(k.error || c.error);
  S.me = k.data || null; S.coach = c.data === true; S.authed = true; S.dbChecked = true; S.mode = "db";
  $(".hbtns").hidden = false;
  if (!S.me && !S.coach) { render(); return; }
  store.start(); startSubs();
  route(); if (S.view === "player") subPlayerLogs();
}
(async function init() {
  $$("[data-logo]").forEach(i => i.src = LOGO);
  if (RECOVERY) S.authView = "reset";
  sb.auth.onAuthStateChange((ev, session) => setTimeout(() => {
    if (ev === "PASSWORD_RECOVERY") { S.authView = "reset"; S.authed = false; renderAuth(); return; }
    if (ev === "SIGNED_OUT") { if (S.authed) location.reload(); return; }
    if (session && !sessionStarted && S.authView !== "reset") startSession(session);
  }, 0));
  const {data: {session}} = await sb.auth.getSession();
  S.authReady = true;
  if (session && S.authView !== "reset") startSession(session); else render();
})();
</script>
</body>
